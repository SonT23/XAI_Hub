site_name: NCKH — XAI & Concept Bottleneck Models
site_description: Wiki nghiên cứu về Explainable AI (XAI) và Concept Bottleneck Models (CBM), gồm ghi chú kiến thức nền, thư viện bài báo, và từ điển thuật ngữ Anh-Việt.

# QUAN TRỌNG: sửa 2 dòng dưới đây thành đúng username/repo GitHub của bạn
# (xem README_MKDOCS.md để biết cách lấy giá trị chính xác)
site_url: https://SonT23.github.io/XAI_Hub/
repo_url: https://github.com/SonT23/XAI_Hub
repo_name: XAI_Hub

theme:
  name: material
  language: vi
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Chuyển sang giao diện tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Chuyển sang giao diện sáng
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang:
        - vi
        - en

nav:
  - Trang chủ: index.md
  - Toán nền tảng:
      - Tổng quan: toan/index.md
      - Đại số tuyến tính: toan/dai-so-tuyen-tinh.md
      - Giải tích: toan/giai-tich.md
      - Xác suất & Thống kê: toan/xac-suat-thong-ke.md
      - "Cheat Sheet: Gradient Descent và các biến thể": toan/cheat-sheet-gradient-descent-va-cac-bien-the.md
      - "Cheat Sheet: Đại số tuyến tính cho Machine Learning": toan/cheat-sheet-dai-so-tuyen-tinh-cho-machine-learning.md
  - ML cơ bản:
      - Tổng quan: ml-co-ban/index.md
      - Model Parameter: ml-co-ban/model-parameter.md
      - Model Hyperparameter: ml-co-ban/model-hyperparameter.md
      - Performance Measures: ml-co-ban/performance-measures.md
      - "Sơ đồ tư duy: Phân loại các nhánh Machine Learning": ml-co-ban/so-do-tu-duy-phan-loai-cac-nhanh-machine-learning.md
  - Deep Learning:
      - Tổng quan: deep-learning/index.md
      - Autoencoder: deep-learning/autoencoder.md
      - Variational Autoencoder (VAE): deep-learning/vae.md
      - Latent Space: deep-learning/latent-space.md
      - CNN: deep-learning/cnn.md
      - Transformer & ViT: deep-learning/transformer-vit.md
      - CLIP: deep-learning/clip.md
      - Cheat Sheet CNN (Stanford CS230): deep-learning/cheat-sheet-cnn-stanford-cs230.md
      - Cẩm nang PyTorch: deep-learning/cam-nang-pytorch.md
      - "Cẩm nang Deep Learning: Transformer": deep-learning/cam-nang-deep-learning-transformer.md
      - "Cẩm nang Deep Learning: Nền tảng Neural Network": deep-learning/cam-nang-deep-learning-nen-tang-neural-network.md
  - Explainable AI:
      - Tổng quan: xai/index.md
      - 1. Tổng quan & Phân loại XAI: xai/01-tong-quan.md
      - 2. Post-hoc: xai/02-post-hoc.md
      - 3. Concept-based: xai/03-concept-based.md
      - 4. CBM: xai/04-cbm.md
      - 5. Biến thể CBM: xai/05-bien-the-cbm.md
      - 6. Đánh giá lời giải thích: xai/06-danh-gia.md
      - 7. Bộ dữ liệu & Công cụ: xai/07-du-lieu-cong-cu.md
  - Thư viện bài báo: papers/index.md
  - Thuật ngữ Anh - Việt:
      - Toàn bộ (A-Z): glossary/all.md
      - Toán: glossary/toan.md
      - ML cơ bản: glossary/ml-co-ban.md
      - Deep Learning: glossary/deep-learning.md
      - CNN: glossary/cnn.md
      - Autoencoder: glossary/autoencoder.md
      - Transformer/CLIP: glossary/transformer-clip.md
      - XAI: glossary/xai.md
      - CBM: glossary/cbm.md
  - Kỹ năng nghiên cứu:
      - Cách đọc bài báo: ky-nang/cach-doc-bai-bao.md
      - Lộ trình đọc: ky-nang/lo-trinh-doc.md
  - Lập trình:
      - Docker cơ bản: lap-trinh/docker-co-ban.md
      - Docker nâng cao: lap-trinh/docker-nang-cao.md
      - "DSA: Nhập môn & Big-O": lap-trinh/dsa-nhap-mon-big-o.md
      - "DSA: Mảng, Chuỗi & Linked List": lap-trinh/dsa-mang-chuoi-linked-list.md
      - "DSA: Stack, Queue & Hashing": lap-trinh/dsa-stack-queue-hashing.md
      - "DSA: Đệ quy, Tìm kiếm & Sắp xếp": lap-trinh/dsa-de-quy-tim-kiem-sap-xep.md
      - "DSA: Trees, Heap & Graphs": lap-trinh/dsa-trees-heap-graphs.md
      - "DSA: DP & Greedy": lap-trinh/dsa-dp-greedy.md
      - "DSA: Kỹ thuật giải bài tập": lap-trinh/dsa-ky-thuat-giai-bai-tap.md
      - "DSA: Tổng ôn tập & Roadmap": lap-trinh/dsa-tong-on-tap-roadmap.md
      - "Python: Cú pháp cơ bản": lap-trinh/python-cu-phap-co-ban.md
      - "Python: Cấu trúc điều khiển": lap-trinh/python-cau-truc-dieu-khien.md
      - "Python: Cấu trúc dữ liệu": lap-trinh/python-cau-truc-du-lieu.md
      - "Python: Functions, Comprehension & Lambda": lap-trinh/python-functions-comprehension-lambda.md
      - "Python: Modules, File & Exception": lap-trinh/python-modules-file-exception.md
      - "Python: OOP": lap-trinh/python-oop.md
      - "Python: Nâng cao & Thư viện": lap-trinh/python-nang-cao-thu-vien.md
      - "Python: Automation, Best Practices & Ôn tập": lap-trinh/python-automation-best-practices-on-tap.md

markdown_extensions:
  - tables
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js
